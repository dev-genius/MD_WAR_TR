name: daily-briefing

on:
  schedule:
    - cron: "0 22 * * *"   # UTC 22:00 = KST 07:00
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write   # content/ 커밋백

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect
        run: python scripts/collect.py

      - name: Generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-5' }}
        run: python scripts/generate.py

      - name: Commit content
        run: |
          git config user.name "briefing-bot"
          git config user.email "actions@github.com"
          git add content data/raw
          git diff --cached --quiet || git commit -m "briefing: $(date -u +%Y-%m-%d)"
          git push

      - name: Build site
        run: python scripts/build_site.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy to Firebase Hosting
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx --yes firebase-tools@13 deploy --only hosting --non-interactive
          rm -f "$RUNNER_TEMP/firebase-sa.json"
