{% extends "base.html" %}
{% block content %}
  <ul class="issue-list">
    {% for issue in issues %}
    <li>
      <h2><a href="{{ issue.slug }}.html">{{ issue.title }}</a></h2>
      <div class="meta">{{ issue.date.isoformat() }}</div>
      {% if issue.summary %}<p>{{ issue.summary }}</p>{% endif %}
    </li>
    {% else %}
    <li>아직 발행된 호가 없습니다.</li>
    {% endfor %}
  </ul>
{% endblock %}
