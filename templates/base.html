<!doctype html>
<html lang="{{ site.locale or 'ko-KR' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site.title }}{% endblock %}</title>
<meta name="description" content="{{ site.description }}">
<link rel="alternate" type="application/rss+xml" title="{{ site.title }} RSS" href="/rss.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:#f7f5f0; --ink:#1b1a17; --muted:#6c6960; --faint:#8f8b80;
    --accent:#7c2d2d; --hair:#dcd6c8; --panel:#efece2;
    --serif:"Nanum Myeongjo", Georgia, "Times New Roman", serif;
    --sans:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard",
           "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#141310; --ink:#e8e4d9; --muted:#9a958a; --faint:#7c776c;
      --accent:#cf8878; --hair:#2f2c24; --panel:#1c1a15;
    }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--sans); font-size:17px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:720px; margin:0 auto; padding:0 20px 80px; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }

  /* ── Masthead ── */
  .masthead { padding:34px 0 0; text-align:center; }
  .masthead .kicker {
    font-size:11px; letter-spacing:.32em; text-transform:uppercase;
    color:var(--muted); margin-bottom:10px;
  }
  .masthead h1 {
    font-family:var(--serif); font-weight:800; font-size:33px;
    letter-spacing:-.01em; margin:0; line-height:1.15;
  }
  .masthead h1 a { color:inherit; }
  .masthead .tagline { color:var(--muted); font-size:13.5px; margin-top:8px; }
  .rule-double {
    border-top:3px solid var(--ink); border-bottom:1px solid var(--ink);
    height:4px; margin:22px 0 0;
  }

  /* ── Issue header ── */
  .dateline {
    display:flex; flex-wrap:wrap; gap:14px; justify-content:center;
    font-size:12px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--muted); padding:16px 0; border-bottom:1px solid var(--hair);
  }
  .dateline .accent { color:var(--accent); }
  article.briefing > h1.headline {
    font-family:var(--serif); font-weight:800; font-size:30px; line-height:1.28;
    letter-spacing:-.01em; margin:30px 0 14px;
  }
  .lead {
    font-size:18.5px; line-height:1.62; color:var(--ink);
    border-left:3px solid var(--accent); padding-left:16px; margin:0 0 26px;
  }

  /* ── Table of contents ── */
  nav.toc {
    display:flex; flex-wrap:wrap; gap:4px 22px;
    padding:14px 0; margin:0 0 10px;
    border-top:1px solid var(--hair); border-bottom:1px solid var(--hair);
    font-size:13px;
  }
  nav.toc a { color:var(--muted); display:inline-flex; gap:7px; align-items:baseline; }
  nav.toc a:hover { color:var(--accent); text-decoration:none; }
  nav.toc .n { font-variant-numeric:tabular-nums; color:var(--accent); font-weight:700; }

  /* ── Sections ── */
  .briefing { padding-top:8px; }
  h2.section-head {
    display:flex; align-items:baseline; gap:12px;
    margin:44px 0 16px; padding-top:16px; border-top:2px solid var(--ink);
    font-family:var(--serif); font-weight:800;
  }
  h2.section-head .section-num {
    font-size:14px; color:var(--accent); font-variant-numeric:tabular-nums;
    letter-spacing:.05em; flex:none; padding-top:4px;
  }
  h2.section-head .section-title { font-size:23px; letter-spacing:-.01em; }

  .briefing h3 {
    font-family:var(--sans); font-weight:700; font-size:15px;
    text-transform:uppercase; letter-spacing:.08em; color:var(--accent);
    margin:26px 0 8px;
  }
  .briefing p { margin:0 0 15px; line-height:1.78; }
  .briefing ul { margin:0 0 16px; padding-left:0; list-style:none; }
  .briefing li {
    position:relative; padding-left:18px; margin:0 0 11px; line-height:1.7;
  }
  .briefing li::before {
    content:""; position:absolute; left:2px; top:.68em;
    width:5px; height:5px; background:var(--accent); border-radius:1px;
  }
  .briefing li em, .briefing p em { color:var(--faint); font-style:normal; font-size:.92em; }
  .briefing strong { font-weight:700; }
  .briefing blockquote {
    margin:0 0 15px; padding:2px 0 2px 16px; border-left:2px solid var(--hair);
    color:var(--muted); font-style:italic;
  }
  .briefing hr { border:0; border-top:1px solid var(--hair); margin:26px 0; }

  /* ── Issue nav ── */
  .issue-nav { display:flex; gap:12px; margin-top:48px; }
  .issue-nav a {
    flex:1; border:1px solid var(--hair); padding:12px 14px; border-radius:3px;
    color:var(--ink); font-size:13px;
  }
  .issue-nav a:hover { border-color:var(--accent); text-decoration:none; }
  .issue-nav .lbl { display:block; color:var(--faint); font-size:11px;
    letter-spacing:.1em; text-transform:uppercase; margin-bottom:3px; }
  .issue-nav .fwd { text-align:right; }

  /* ── Archive index ── */
  .archive { list-style:none; padding:0; margin:26px 0 0; }
  .archive li { padding:22px 0; border-bottom:1px solid var(--hair); }
  .archive .meta {
    font-size:11.5px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--muted); margin-bottom:7px;
  }
  .archive .meta .accent { color:var(--accent); }
  .archive h2 { font-family:var(--serif); font-weight:700; font-size:20px;
    line-height:1.34; margin:0 0 8px; }
  .archive h2 a { color:var(--ink); }
  .archive h2 a:hover { color:var(--accent); text-decoration:none; }
  .archive p { margin:0; color:var(--muted); font-size:14.5px; line-height:1.62; }

  /* ── Footer ── */
  footer {
    margin-top:64px; padding-top:18px; border-top:1px solid var(--hair);
    color:var(--faint); font-size:12px; line-height:1.7;
  }
  footer a { color:var(--muted); }

  @media (max-width:480px) {
    body { font-size:16px; }
    .masthead h1 { font-size:27px; }
    article.briefing > h1.headline { font-size:24px; }
    h2.section-head .section-title { font-size:20px; }
    .issue-nav { flex-direction:column; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="kicker">Daily Security Briefing</div>
    <h1><a href="/">{{ site.title }}</a></h1>
    <div class="tagline">{{ site.description }}</div>
    <div class="rule-double"></div>
  </header>

  {% block content %}{% endblock %}

  <footer>
    <p>매일 07:00(KST) 자동 발행 · <a href="/rss.xml">RSS</a> · <a href="/">지난 호</a></p>
    <p>뉴스 원문 저작권은 각 매체에 있으며 본 브리핑은 요약과 출처 링크만 제공합니다.
    OSINT·분석기관 평가는 미확인 정보를 포함할 수 있습니다. 자동 생성 문서로 오류가 있을 수 있습니다.</p>
  </footer>
</div>
</body>
</html>
